<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Image carousel</title>
    <script defer src="slideshow.js"></script>
  </head>
  <body>
    <img id="carousel-img" src="./assets/cute-cat-a.png" alt="cat-pic" />
    <div id="time-container">
      <p id="time-background">&nbsp</p>
      <p id="time-remaining">--:--</p>
    </div>
    <div id="btn-container">
      <button type="button" id="backward-auto-btn"><span>Auto Backwards</span></button>
      <button type="button" id="backward-btn"><span>Backwards</span></button>
      <button type="button" id="stop-auto-btn"><span>Stop</span></button>
      <button type="button" id="forward-btn"><span>Forward</span></button>
      <button type="button" id="forward-auto-btn"><span>Auto Forward</span></button>
    </div>
  </body>
</html>
